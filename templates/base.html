<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CDC Audit Demo{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav>
  <a href="/" class="nav-brand">cdc-audit</a>
  <a href="/" class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">Products</a>
  <a href="/orders/" class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}">Orders</a>
  <a href="/audit/" class="nav-link {% if 'audit' in request.resolver_match.url_name %}active{% endif %}">Audit Log</a>
</nav>

{% if messages %}
<div class="messages">
  {% for message in messages %}
  <div class="message {{ message.tags }}">{{ message }}</div>
  {% endfor %}
</div>
<script>setTimeout(() => document.querySelectorAll('.message').forEach(m => m.remove()), 3500)</script>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
